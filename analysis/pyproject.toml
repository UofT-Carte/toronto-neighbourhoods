[project]
name = "neighbourhood-analysis"
version = "0.1.0"
description = "Toronto neighbourhoods name/shape agreement analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pyproj>=3.7.2",
    "rapidfuzz>=3.14.5",
    "scipy>=1.18.0",
    "shapely>=2.1.2",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
